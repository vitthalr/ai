<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeuomorphic Notepad</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="desk">
        <div class="notepad">
            <div class="notepad-spiral">
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
            </div>
            <div class="notepad-content">
                <h1>My Notes</h1>
                <div class="line"></div>
                <textarea placeholder="Write your notes here..."></textarea>
            </div>
        </div>
        
        <div class="stationery">
            <div class="pencil">
                <div class="pencil-tip"></div>
                <div class="pencil-body"></div>
                <div class="pencil-eraser"></div>
            </div>
            <div class="coffee-cup">
                <div class="cup-body">
                    <div class="cup-handle"></div>
                    <div class="coffee"></div>
                    <div class="steam"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
