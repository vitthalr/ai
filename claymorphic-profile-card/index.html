<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claymorphic Profile Card</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="avatar-container">
                    <div class="avatar">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile Picture">
                    </div>
                </div>
                <div class="status-badge online"></div>
            </div>
            
            <div class="card-content">
                <h2>Sophia Anderson</h2>
                <p class="title">Senior UX Designer</p>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value">125</span>
                        <span class="stat-label">Projects</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">12K</span>
                        <span class="stat-label">Followers</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">86</span>
                        <span class="stat-label">Likes</span>
                    </div>
                </div>
                
                <p class="bio">Passionate designer creating intuitive and beautiful experiences. Available for freelance work and collaborations.</p>
                
                <div class="skills">
                    <span class="skill-tag">UI Design</span>
                    <span class="skill-tag">Figma</span>
                    <span class="skill-tag">Adobe XD</span>
                    <span class="skill-tag">Prototyping</span>
                </div>
                
                <div class="social-links">
                    <a href="#" class="social-btn"><i class="fab fa-dribbble"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-behance"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="social-btn"><i class="fab fa-twitter"></i></a>
                </div>
                
                <button class="connect-btn">Connect</button>
            </div>
        </div>
    </div>
</body>
</html>
