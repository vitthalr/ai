<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Todo List</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Glassmorphic Todo</h1>
            <div class="input-container">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button id="add-btn"><i class="fas fa-plus"></i></button>
            </div>
            <ul class="task-list">
                <li class="task-item">
                    <span class="task-text">Complete the design project</span>
                    <div class="task-actions">
                        <button class="complete-btn"><i class="fas fa-check"></i></button>
                        <button class="delete-btn"><i class="fas fa-trash"></i></button>
                    </div>
                </li>
                <li class="task-item completed">
                    <span class="task-text">Research glassmorphism trend</span>
                    <div class="task-actions">
                        <button class="complete-btn"><i class="fas fa-check"></i></button>
                        <button class="delete-btn"><i class="fas fa-trash"></i></button>
                    </div>
                </li>
                <li class="task-item">
                    <span class="task-text">Update portfolio website</span>
                    <div class="task-actions">
                        <button class="complete-btn"><i class="fas fa-check"></i></button>
                        <button class="delete-btn"><i class="fas fa-trash"></i></button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
